[package]
name = "physics-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "A desktop 3D physics sandbox: the solar system under Newtonian gravity, at true scale."
license = "MIT"
publish = false

# Tests live in `tst/`, not Cargo's conventional `tests/`. Unit tests are `#[path]`-included into
# their modules from `tst/`, so Cargo needs no entry for them. Cargo does not auto-discover
# integration tests outside `tests/`, so each one is declared below. See `tst/README.md`.
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "physics-sandbox"
path = "src/main.rs"

# The only true integration test: `MinimalPlugins` + `ScenePlugin`, ticked headlessly.
[[test]]
name = "headless_app"
path = "tst/headless_app.rs"

[features]
# `gpu-tests` compiles the unit tests that open a GPU (`tst/**/*_gpu_tests.rs`). On by default: they
# fail on a machine without one. CI's required job turns it off (`--no-default-features`). Without
# it a unit-test build has no `GpuDevice::request`, so a GPU test left unmarked does not compile.
# It changes nothing in the app. See `tst/README.md`.
default = ["gpu-tests"]
gpu-tests = []

[dependencies]
# The code is written against Bevy 0.14's API (`PbrBundle`, `Camera3dBundle`, `SmaaSettings`).
# Default features include `smaa_luts` and `tonemapping_luts`, which `src/performance/` and the
# renderer rely on.
bevy = "0.14"
# The `bevy_egui` line that targets Bevy 0.14. `src/ui/` is the only module that imports it.
bevy_egui = "0.28"
serde = { version = "1.0.229", features = ["derive"] }
# The GPU physics in `src/compute/`. The same wgpu Bevy 0.14 renders with (it is already in the
# lock file), named directly because Bevy re-exports only some of its types and not the
# `Instance` a headless compute device starts from. The features are the native ones Bevy turns
# on; Vulkan needs none.
wgpu = { version = "0.20.1", default-features = false, features = ["wgsl", "dx12", "metal"] }
toml = "1.2.1"

[dev-dependencies]
proptest = "1"

# Dependencies build fully optimised and the crate lightly, so a dev build of the solar system
# runs about as fast as release and still rebuilds quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
