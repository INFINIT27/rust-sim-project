# Quality-versus-frame-time switches. The RGA_AA, RGA_FLOOR_ECLIPSE and
# RGA_VSYNC environment variables override these for one run.

# msaa4, msaa2, smaa, fxaa, or off.
anti_aliasing = "msaa4"
# Eclipse shadows on the floor. Spheres always get them.
floor_eclipse = true
# Wait for the display's refresh.
vsync = true
# Ray-march the black hole on the GPU. Off draws it as a plain black ball.
black_hole = true
# low, medium, or high: how finely the black hole's light is followed.
black_hole_quality = "medium"
# Stars round the black hole, seen through its lens.
black_hole_stars = true
